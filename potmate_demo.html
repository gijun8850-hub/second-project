<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>팟메이트(PotMate) 데모</title>
  <style>
:root {
  --color-main: #AA01E7;
  --color-soft: #F8E7FE;
  --color-ink: #24142B;
  --color-muted: #7B6685;
  --color-line: #EFD8F8;
  --color-card: rgba(255, 255, 255, 0.9);
  --color-success: #1E9B68;
  --color-warning: #D86A00;
  --gradient-main: linear-gradient(135deg, #AA01E7 0%, #CF4BFF 48%, #7F39FB 100%);
  --gradient-soft: linear-gradient(145deg, #FFFFFF 0%, #F8E7FE 100%);
  --gradient-onboarding: linear-gradient(160deg, #FFFFFF 0%, #FDF7FF 34%, #F8E7FE 68%, #F1D8FB 100%);
  --gradient-hub: linear-gradient(145deg, rgba(255, 255, 255, 0.98) 0%, rgba(248, 231, 254, 0.96) 44%, rgba(241, 216, 251, 0.95) 100%);
  --shadow-card: 0 18px 42px rgba(91, 17, 125, 0.14);
  --shadow-button: 0 12px 24px rgba(170, 1, 231, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.45);
  font-family: "Pretendard", "SUIT", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
}

body {
  min-height: 100vh;
  margin: 0;
  color: var(--color-ink);
  background:
    radial-gradient(circle at 16% 0%, rgba(248, 231, 254, 0.95), transparent 32rem),
    linear-gradient(180deg, #fff 0%, #fbf3ff 100%);
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

em {
  font-style: normal;
}

.mobile-shell {
  position: relative;
  width: min(100%, 440px);
  min-height: 100vh;
  margin: 0 auto;
  overflow: hidden;
  background: linear-gradient(180deg, #fff 0%, #fdf8ff 48%, #f8edff 100%);
  box-shadow: 0 0 50px rgba(58, 19, 84, 0.12);
}

.screen {
  min-height: 100vh;
  padding: 22px 18px 102px;
}

.screen-enter {
  animation: screenEnter 220ms ease;
}

@keyframes screenEnter {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.onboarding-screen {
  position: relative;
  display: grid;
  align-content: start;
  gap: 18px;
  min-height: 100vh;
  padding: 30px 20px 28px;
  color: var(--color-ink);
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(circle at 18% 14%, rgba(255, 255, 255, 0.92), transparent 9rem),
    radial-gradient(circle at 82% 10%, rgba(222, 180, 247, 0.5), transparent 8rem),
    radial-gradient(circle at 70% 78%, rgba(170, 1, 231, 0.12), transparent 11rem),
    var(--gradient-onboarding);
}

.onboarding-screen > * {
  position: relative;
  z-index: 1;
}

.onboarding-screen--scene {
  background:
    radial-gradient(circle at 16% 10%, rgba(255, 255, 255, 0.88), transparent 10rem),
    radial-gradient(circle at 84% 8%, rgba(231, 198, 250, 0.48), transparent 11rem),
    linear-gradient(180deg, rgba(255, 255, 255, 0.88) 0%, rgba(255, 255, 255, 0.58) 17%, rgba(255, 255, 255, 0.14) 36%, rgba(250, 240, 255, 0.18) 58%, rgba(247, 231, 254, 0.84) 100%);
}

.onboarding-scene-layer,
.onboarding-screen--scene::before {
  position: absolute;
  inset: 0;
}

.onboarding-scene-layer {
  z-index: 0;
  background-repeat: no-repeat;
  background-position: center top;
  background-size: 112% auto;
  transform: scale(1.02);
  pointer-events: none;
}

.onboarding-screen--scene::before {
  content: "";
  z-index: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0.44) 16%, rgba(255, 255, 255, 0.08) 31%, rgba(255, 255, 255, 0) 43%, rgba(255, 255, 255, 0.04) 56%, rgba(247, 236, 253, 0.38) 74%, rgba(247, 236, 253, 0.92) 100%);
}

.onboarding-header,
.onboarding-brand,
.onboarding-action-card {
  display: flex;
  align-items: center;
}

.onboarding-header {
  justify-content: space-between;
}

.onboarding-brand {
  gap: 10px;
  font-weight: 900;
  color: var(--color-main);
}

.brand-icon {
  display: grid;
  width: 42px;
  height: 42px;
  place-items: center;
  border-radius: 16px;
  color: var(--color-main);
  background: rgba(255, 255, 255, 0.96);
  box-shadow: inset 0 1px 0 #fff, 0 14px 30px rgba(170, 1, 231, 0.16);
}

.onboarding-alert {
  position: relative;
  display: grid;
  width: 42px;
  height: 42px;
  place-items: center;
  border-radius: 16px;
  color: #6d2cc4;
  background: rgba(255, 255, 255, 0.94);
  box-shadow: 0 12px 26px rgba(89, 21, 124, 0.12);
  font-size: 17px;
}

.onboarding-alert i {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #bb3cff;
}

.onboarding-copy h1 {
  margin: 0;
  font-size: 31px;
  line-height: 1.08;
  letter-spacing: -0.04em;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.22);
}

.onboarding-copy h1 span {
  color: var(--color-main);
}

.onboarding-copy p {
  margin: 10px 0 0;
  color: rgba(76, 57, 90, 0.9);
  font-size: 17px;
  line-height: 1.35;
}

.onboarding-photo-card {
  min-height: 272px;
  margin: -4px -20px -30px;
  background: transparent;
  box-shadow: none;
}

.onboarding-photo {
  width: 100%;
  height: 100%;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.02) 54%, rgba(248, 233, 254, 0.74) 100%);
}

.onboarding-card-stack {
  display: grid;
  gap: 14px;
  margin-top: 0;
}

.onboarding-action-card {
  gap: 14px;
  padding: 18px 16px;
  border: 1px solid rgba(255, 255, 255, 0.58);
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.42);
  box-shadow: 0 18px 40px rgba(82, 19, 114, 0.1);
  backdrop-filter: blur(18px) saturate(1.08);
}

.onboarding-action-icon {
  position: relative;
  display: grid;
  width: 56px;
  height: 56px;
  flex: 0 0 56px;
  place-items: center;
  border-radius: 50%;
  color: #a220e4;
  background: linear-gradient(180deg, #fff 0%, #f8eaff 100%);
  box-shadow: inset 0 0 0 1px rgba(239, 216, 248, 0.95);
  font-size: 26px;
  font-weight: 900;
}

.onboarding-action-icon--pin span {
  position: relative;
  top: -1px;
}

.onboarding-action-icon--pin::after {
  content: "1";
  position: absolute;
  top: -6px;
  right: -4px;
  display: grid;
  width: 24px;
  height: 24px;
  place-items: center;
  border-radius: 50%;
  color: #fff;
  background: var(--gradient-main);
  box-shadow: 0 10px 22px rgba(170, 1, 231, 0.24);
  font-size: 13px;
}

.onboarding-action-copy {
  min-width: 0;
  flex: 1 1 auto;
}

.onboarding-action-copy strong {
  display: block;
  margin-bottom: 4px;
  font-size: 15px;
}

.onboarding-action-copy p {
  margin: 0;
  color: var(--color-muted);
  font-size: 13px;
  line-height: 1.4;
}

.onboarding-action-copy em {
  color: var(--color-main);
  font-weight: 900;
}

.onboarding-action-arrow {
  color: #a38ab4;
  font-size: 32px;
  line-height: 1;
}

.onboarding-chip-block {
  display: grid;
  gap: 12px;
}

.onboarding-chip-title {
  font-size: 15px;
}

.onboarding-chip-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.onboarding-chip {
  display: inline-flex;
  min-height: 42px;
  align-items: center;
  justify-content: center;
  padding: 0 10px;
  border-radius: 999px;
  color: #6d6281;
  background: rgba(255, 255, 255, 0.92);
  box-shadow: inset 0 0 0 1px rgba(239, 216, 248, 0.92), 0 8px 18px rgba(89, 21, 124, 0.06);
  font-size: 13px;
  font-weight: 800;
  white-space: nowrap;
}

.onboarding-chip-button {
  width: 100%;
}

.onboarding-chip.is-active {
  color: var(--color-main);
  box-shadow: inset 0 0 0 2px rgba(170, 1, 231, 0.8), 0 10px 20px rgba(89, 21, 124, 0.08);
}

.onboarding-start-button {
  min-height: 56px;
  margin-top: 4px;
  font-size: 17px;
}

.onboarding-login-note {
  margin: 0;
  color: var(--color-muted);
  text-align: center;
  font-size: 13px;
}

.onboarding-login-note span {
  color: var(--color-main);
  font-weight: 900;
}

.onboarding-login-link {
  display: inline-flex;
  align-items: center;
  padding: 0;
  color: var(--color-main);
  background: transparent;
  font-weight: 900;
}

.login-card {
  padding: 18px;
  backdrop-filter: blur(16px);
}

.login-form {
  gap: 16px;
}

.floating-preview,
.form-stack,
.detail-stack,
.payment-stack,
.timeline-list,
.chat-list,
.coupon-grid {
  display: grid;
  gap: 14px;
}

.preview-card,
.glass-card,
.pot-card,
.history-card,
.settlement-row,
.coupon-card {
  border: 1px solid rgba(255, 255, 255, 0.88);
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.82);
  box-shadow: var(--shadow-card);
}

.preview-card {
  padding: 18px;
  backdrop-filter: blur(16px);
}

.student-chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 22px;
}

.student-chip-row--compact {
  margin-top: 18px;
}

.student-chip {
  display: inline-flex;
  align-items: center;
  min-height: 34px;
  padding: 0 14px;
  border-radius: 999px;
  color: #7d35b7;
  background: rgba(255, 255, 255, 0.82);
  box-shadow: inset 0 0 0 1px rgba(239, 216, 248, 0.92);
  font-size: 12px;
  font-weight: 800;
}

.home-hero-note {
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  padding: 0 12px;
  border-radius: 999px;
  color: #8b2bc8;
  background: rgba(255, 255, 255, 0.86);
  box-shadow: inset 0 0 0 1px rgba(239, 216, 248, 0.92);
  font-size: 12px;
  font-weight: 900;
}

.hero-spotlight-card,
.hero-stat-card {
  border: 1px solid rgba(255, 255, 255, 0.88);
  background: rgba(255, 255, 255, 0.9);
  box-shadow: var(--shadow-card);
}

.hero-spotlight-card {
  display: grid;
  gap: 6px;
  margin-top: 16px;
  padding: 16px 18px;
  border-radius: 24px;
}

.hero-spotlight-card--inline {
  margin-top: 18px;
}

.hero-spotlight-card strong,
.hero-stat-card strong {
  font-size: 16px;
}

.hero-spotlight-card span,
.hero-stat-card span {
  color: var(--color-muted);
  line-height: 1.45;
}

.hero-stat-card {
  padding: 18px;
  border-radius: 24px;
  backdrop-filter: blur(14px);
}

.preview-card strong {
  display: block;
  margin-bottom: 6px;
}

.preview-card span,
.page-title p,
.card-copy,
.inline-note,
.history-card span,
.announcement,
.timeline-item p,
.coupon-card p,
.hub-highlight p {
  color: var(--color-muted);
  line-height: 1.55;
}

.gradient-button,
.secondary-button,
.ghost-button,
.danger-button {
  display: inline-flex;
  min-height: 48px;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 18px;
  border-radius: 18px;
  font-weight: 800;
  white-space: nowrap;
  line-height: 1.1;
}

.gradient-button {
  color: #fff;
  background: var(--gradient-main);
  box-shadow: var(--shadow-button);
}

.secondary-button {
  color: var(--color-main);
  background: #fff;
  box-shadow: inset 0 0 0 1px var(--color-line), 0 12px 26px rgba(80, 17, 110, 0.1);
}

.ghost-button {
  min-height: 38px;
  color: var(--color-main);
  background: var(--color-soft);
}

.danger-button {
  color: #B4234B;
  background: #FFE9F0;
}

.full-button {
  width: 100%;
}

.topbar,
.section-heading,
.pot-card__head,
.pot-card__footer,
.info-row,
.history-card,
.settlement-row,
.chat-header__title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.topbar {
  margin-bottom: 18px;
}

.topbar--hub {
  margin-bottom: 16px;
}

.location-pill,
.status-pill,
.category-badge,
.trust-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
}

.location-pill {
  padding: 9px 12px;
  color: var(--color-main);
  background: var(--color-soft);
}

.status-pill {
  padding: 7px 10px;
  color: #6D22BC;
  background: #F1DDFF;
}

.category-badge {
  padding: 6px 9px;
  color: #fff;
  background: var(--gradient-main);
}

.trust-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.trust-badge {
  padding: 7px 10px;
  color: var(--color-main);
  background: rgba(248, 231, 254, 0.9);
}

.hub-highlight {
  margin-bottom: 18px;
  padding: 22px;
  border-radius: 30px;
  background: var(--gradient-hub);
  box-shadow: var(--shadow-card);
}

.hub-highlight__label {
  display: inline-flex;
  padding: 6px 10px;
  border-radius: 999px;
  color: var(--color-main);
  background: rgba(255, 255, 255, 0.9);
  font-size: 12px;
  font-weight: 800;
}

.hub-highlight h1,
.page-title h1,
.detail-hero h1,
.join-summary h1 {
  margin: 12px 0 10px;
  font-size: 29px;
  line-height: 1.18;
}

.hub-summary-grid,
.meta-grid,
.spotlight-grid,
.wallet-quick-charge,
.stage-track,
.host-actions,
.filter-row {
  display: grid;
  gap: 10px;
}

.hub-summary-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  margin-top: 16px;
}

.hub-stat {
  padding: 14px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.76);
  box-shadow: inset 0 1px 0 #fff;
}

.hub-stat span,
.hub-stat__meta,
.filter-field span,
.form-field span,
.message-name,
.participant-count,
.timeline-item p,
.chat-header__title span {
  font-size: 12px;
  font-weight: 700;
}

.hub-stat strong {
  display: block;
  margin: 6px 0 2px;
  font-size: 18px;
}

.search-box,
.filter-field,
.form-field {
  display: grid;
  gap: 7px;
}

.search-box {
  margin: 18px 0 14px;
}

.search-box input,
.filter-field select,
.form-field input,
.form-field select,
.form-field textarea {
  width: 100%;
  border: 1px solid var(--color-line);
  border-radius: 18px;
  outline: none;
  color: var(--color-ink);
  background: rgba(255, 255, 255, 0.92);
  box-shadow: inset 0 1px 0 #fff, 0 10px 22px rgba(80, 17, 110, 0.08);
}

.search-box input,
.filter-field select,
.form-field input,
.form-field select {
  min-height: 48px;
  padding: 0 14px;
}

.form-field textarea {
  min-height: 104px;
  padding: 14px;
  resize: vertical;
}

.filter-row {
  grid-template-columns: 1fr 1fr;
  margin-bottom: 14px;
}

.category-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 0 12px;
  scrollbar-width: none;
}

.category-tabs button {
  flex: 0 0 auto;
  min-height: 38px;
  padding: 0 14px;
  border-radius: 999px;
  color: var(--color-muted);
  background: #fff;
  box-shadow: inset 0 0 0 1px var(--color-line);
}

.category-tabs button.is-active {
  color: #fff;
  background: var(--gradient-main);
  box-shadow: var(--shadow-button);
}

.home-section {
  display: grid;
  gap: 12px;
  margin-top: 20px;
}

.home-section h2,
.timeline-card h2 {
  margin: 0;
  font-size: 18px;
}

.section-heading span {
  color: var(--color-muted);
  font-size: 12px;
  font-weight: 800;
}

.closing-soon-section .section-heading span {
  color: var(--color-warning);
}

.pot-list {
  display: grid;
  gap: 16px;
}

.spotlight-grid {
  grid-template-columns: 1fr;
}

.pot-card {
  padding: 20px;
  background: var(--gradient-soft);
}

.pot-card--compact {
  padding: 18px;
}

.pot-card h2 {
  margin: 14px 0 8px;
  font-size: 19px;
}

.meta-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  margin: 14px 0 16px;
}

.meta-chip {
  min-width: 0;
  padding: 12px;
  border-radius: 16px;
  color: var(--color-muted);
  background: rgba(255, 255, 255, 0.76);
  font-size: 12px;
}

.meta-chip strong,
.timeline-item strong,
.history-card strong {
  display: block;
  margin-top: 4px;
  color: var(--color-ink);
  font-size: 14px;
}

.glass-card {
  padding: 18px;
}

.detail-hero,
.join-summary {
  text-align: left;
}

.detail-grid,
.timeline-card {
  margin-top: 14px;
}

.timeline-item {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
}

.timeline-dot {
  width: 12px;
  height: 12px;
  margin-top: 4px;
  border-radius: 50%;
  background: #E6D3F3;
  box-shadow: 0 0 0 4px rgba(248, 231, 254, 0.8);
}

.timeline-item.is-done .timeline-dot {
  background: var(--color-success);
}

.timeline-item.is-current .timeline-dot {
  background: var(--color-main);
}

.participant-strip {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
}

.avatar,
.message-profile {
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #fff;
  background: var(--gradient-main);
  font-weight: 900;
}

.avatar {
  width: 36px;
  height: 36px;
  font-size: 12px;
}

.participant-count {
  color: var(--color-muted);
}

.back-button {
  width: 42px;
  height: 42px;
  border-radius: 16px;
  color: var(--color-main);
  background: var(--color-soft);
  font-size: 24px;
  font-weight: 900;
}

.fixed-action {
  position: sticky;
  bottom: 84px;
  margin-top: 18px;
}

.price-xl {
  display: block;
  margin: 16px 0;
  color: var(--color-main);
  font-size: 36px;
}

.notice {
  padding: 14px;
  border-radius: 18px;
  color: #6D22BC;
  background: var(--color-soft);
  line-height: 1.5;
}

.notice--warning {
  color: var(--color-warning);
}

.chat-header {
  position: sticky;
  top: 0;
  z-index: 2;
  margin: -22px -18px 20px;
  padding: 20px 18px 22px;
  color: #fff;
  background: var(--gradient-main);
  box-shadow: 0 14px 26px rgba(85, 0, 134, 0.18);
}

.chat-header strong {
  display: block;
  font-size: 20px;
}

.settlement-stage {
  margin-bottom: 14px;
}

.stage-track {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.stage-step {
  padding: 12px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  box-shadow: inset 0 0 0 1px rgba(239, 216, 248, 0.9);
}

.stage-step strong {
  display: block;
  font-size: 13px;
}

.stage-step span {
  color: var(--color-muted);
  font-size: 11px;
}

.stage-step.is-done {
  background: rgba(232, 251, 243, 0.96);
}

.stage-step.is-done strong {
  color: var(--color-success);
}

.stage-step.is-current {
  background: rgba(248, 231, 254, 0.96);
  box-shadow: inset 0 0 0 1px rgba(170, 1, 231, 0.22);
}

.stage-step.is-current strong {
  color: var(--color-main);
}

.host-actions {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin-bottom: 14px;
}

.host-actions button {
  min-height: 40px;
  border-radius: 14px;
  color: var(--color-main);
  background: #fff;
  padding: 0 10px;
  font-size: 11px;
  font-weight: 900;
  box-shadow: 0 10px 20px rgba(80, 17, 110, 0.08);
  white-space: nowrap;
}

.announcement {
  padding: 16px;
  border-radius: 18px;
  background: #F5E6FF;
  font-weight: 800;
}

.chat-list {
  margin: 18px 0;
}

.message-row {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr);
  align-items: end;
  gap: 10px;
  margin: 4px 0;
}

.message-row.is-own {
  grid-template-columns: minmax(0, 1fr);
  justify-items: end;
}

.message-profile {
  width: 40px;
  height: 40px;
  font-size: 13px;
  box-shadow: 0 10px 20px rgba(170, 1, 231, 0.18);
}

.message-body {
  display: grid;
  max-width: 84%;
  gap: 6px;
}

.message-row:not(.is-own) .message-body {
  justify-items: start;
}

.message-row.is-own .message-body {
  justify-items: end;
}

.message-name {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--color-muted);
}

.host-badge {
  padding: 3px 7px;
  border-radius: 999px;
  color: var(--color-main);
  background: var(--color-soft);
  font-size: 11px;
  font-weight: 900;
}

.message {
  max-width: 100%;
  padding: 14px 16px;
  border-radius: 20px;
  background: #fff;
  box-shadow: 0 10px 22px rgba(80, 17, 110, 0.08);
  line-height: 1.5;
}

.message.mine {
  color: #fff;
  background: var(--gradient-main);
}

.message.system {
  justify-self: center;
  max-width: 100%;
  color: var(--color-main);
  background: var(--color-soft);
  text-align: center;
  font-weight: 800;
}

.chat-input {
  position: sticky;
  bottom: 78px;
  display: grid;
  grid-template-columns: 1fr 74px;
  gap: 10px;
  margin-top: 18px;
  padding-top: 16px;
  background: linear-gradient(180deg, rgba(253, 248, 255, 0), #fdf8ff 35%);
}

.chat-input input {
  min-width: 0;
  border: 1px solid var(--color-line);
  border-radius: 18px;
  padding: 0 14px;
}

.history-card,
.settlement-row,
.coupon-card {
  padding: 14px;
  background: #fff;
}

.history-card__meta {
  text-align: right;
}

.wallet-card {
  overflow: hidden;
  color: #fff;
  background: var(--gradient-main);
}

.wallet-card .price-xl,
.wallet-card p {
  color: #fff;
}

.wallet-quick-charge {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin: 14px 0 10px;
}

.quick-charge-button {
  min-height: 54px;
  padding: 0 10px;
  font-size: 13px;
}

.coupon-card span {
  display: inline-flex;
  margin-bottom: 8px;
  padding: 6px 10px;
  border-radius: 999px;
  color: var(--color-main);
  background: var(--color-soft);
  font-size: 11px;
  font-weight: 800;
}

.coupon-card strong {
  display: block;
  margin-bottom: 4px;
  font-size: 15px;
}

.empty-state {
  padding: 28px 18px;
  border-radius: 18px;
  color: var(--color-muted);
  background: rgba(255, 255, 255, 0.76);
  text-align: center;
}

.bottom-nav {
  position: fixed;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 4;
  width: min(100%, 440px);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 10px 12px 14px;
  border-top: 1px solid rgba(239, 216, 248, 0.9);
  background: rgba(255, 255, 255, 0.88);
  box-shadow: 0 -16px 36px rgba(80, 17, 110, 0.12);
  backdrop-filter: blur(16px);
}

.bottom-nav button {
  min-height: 52px;
  border-radius: 18px;
  color: var(--color-muted);
  background: transparent;
  font-size: 12px;
  font-weight: 900;
}

.bottom-nav button.is-active {
  color: var(--color-main);
  background: var(--color-soft);
}

.toast {
  position: fixed;
  right: 50%;
  bottom: 92px;
  z-index: 9;
  width: min(360px, calc(100% - 36px));
  padding: 14px 16px;
  border-radius: 18px;
  color: #fff;
  background: rgba(36, 20, 43, 0.92);
  box-shadow: 0 16px 34px rgba(36, 20, 43, 0.26);
  opacity: 0;
  pointer-events: none;
  transform: translate(50%, 14px);
  transition: 180ms ease;
}

.toast.is-visible {
  opacity: 1;
  transform: translate(50%, 0);
}

@media (min-width: 720px) {
  body {
    padding: 24px 0;
  }

  .mobile-shell {
    min-height: calc(100vh - 48px);
    border-radius: 34px;
  }

  .bottom-nav {
    bottom: 24px;
    border-radius: 0 0 34px 34px;
  }
}

@media (max-width: 420px) {
  .screen {
    padding-right: 14px;
    padding-left: 14px;
  }

  .hub-highlight h1,
  .page-title h1,
  .detail-hero h1,
  .join-summary h1 {
    font-size: 25px;
  }

  .onboarding-hero h1 {
    font-size: 34px;
  }

  .host-actions,
  .wallet-quick-charge,
  .filter-row,
  .hub-summary-grid,
  .meta-grid,
  .stage-track {
    grid-template-columns: 1fr;
  }
}

(function (root, factory) {

  const CATEGORY_FIELDS = {
    '배달팟': ['subCategory', 'menuHighlight', 'orderTime', 'pickupPoint'],
    '택시팟': ['subCategory', 'departurePoint', 'destination', 'departureTime', 'estimatedFare'],
    '구독팟': ['subCategory', 'serviceName', 'period', 'seatType'],
    '기타팟': ['subCategory', 'purpose', 'place', 'estimatedAmount']
  };

  const CATEGORY_DEFAULTS = {
    '배달팟': { joinRadiusMeters: 300, subCategory: '치킨' },
    '택시팟': { joinRadiusMeters: 500, subCategory: '귀가' },
    '구독팟': { joinRadiusMeters: 500, subCategory: 'OTT' },
    '기타팟': { joinRadiusMeters: 500, subCategory: '공동구매' }
  };

  const SETTLEMENT_STAGES = ['정산 대기', '정산 요청됨', '정산 완료'];

  function clone(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function formatWon(amount) {
    return `${Number(amount || 0).toLocaleString('ko-KR')}원`;
  }

  function remainingSeats(pot) {
    return Math.max(Number(pot.maxMembers || 0) - Number(pot.currentMembers || 0), 0);
  }

  function normalizeRecruitStatus(pot) {
    if (Number(pot.currentMembers || 0) >= Number(pot.maxMembers || 0)) return '모집완료';
    if (remainingSeats(pot) <= 1) return '마감임박';
    return pot.recruitStatus || '모집중';
  }

  function searchTextFor(pot) {
    return [
      pot.title,
      pot.category,
      pot.subCategory,
      pot.locationSummary,
      pot.location,
      pot.description,
      pot.urgencyLabel,
      ...(pot.trustBadges || []),
      ...Object.values(pot.detail || {})
    ].filter(Boolean).join(' ').toLowerCase();
  }

  function filterPots(pots, filters) {
    const category = filters.category || '전체';
    const query = (filters.query || '').trim().toLowerCase();
    const radius = Number(filters.radius || 0);

    return pots.filter((pot) => {
      const categoryMatches = category === '전체' || pot.category === category;
      const queryMatches = !query || searchTextFor(pot).includes(query);
      const radiusMatches = !radius || Number(pot.distanceMeters || 0) <= radius;
      return categoryMatches && queryMatches && radiusMatches;
    });
  }

  function sortPots(pots, sortMode) {
    const items = clone(pots);
    if (sortMode === 'urgent') {
      return items.sort((left, right) => {
        const leftRank = Number(left.urgencyRank || 99);
        const rightRank = Number(right.urgencyRank || 99);
        if (leftRank !== rightRank) return leftRank - rightRank;
        return Number(left.distanceMeters || 0) - Number(right.distanceMeters || 0);
      });
    }

    return items.sort((left, right) => {
      const distanceGap = Number(left.distanceMeters || 0) - Number(right.distanceMeters || 0);
      if (distanceGap !== 0) return distanceGap;
      return Number(left.urgencyRank || 99) - Number(right.urgencyRank || 99);
    });
  }

  function buildCategoryStats(pots) {
    return ['배달팟', '택시팟', '구독팟', '기타팟'].map((category) => {
      const items = pots.filter((pot) => pot.category === category && normalizeRecruitStatus(pot) !== '모집완료');
      return {
        category,
        count: items.length,
        closestDistance: items.length ? Math.min(...items.map((pot) => Number(pot.distanceMeters || 0))) : null
      };
    });
  }

  function buildHomeSections(pots, filters) {
    const visible = sortPots(filterPots(pots, filters), filters.sortMode || 'distance');
    const recommended = visible.filter((pot) => normalizeRecruitStatus(pot) !== '모집완료').slice(0, 3);
    const closingSoon = sortPots(
      visible.filter((pot) => normalizeRecruitStatus(pot) === '마감임박' || Number(pot.urgencyRank || 99) <= 2),
      'urgent'
    ).slice(0, 3);
    const categorySpotlights = ['배달팟', '택시팟', '구독팟', '기타팟']
      .map((category) => sortPots(pots.filter((pot) => pot.category === category), filters.sortMode || 'distance')[0])
      .filter(Boolean);

    return {
      visible,
      recommended,
      closingSoon,
      categorySpotlights,
      categoryStats: buildCategoryStats(filterPots(pots, { category: '전체', query: '', radius: filters.radius || 0 }))
    };
  }

  function buildTrustBadges(category, input) {
    const base = ['안전정산'];
    if (category === '배달팟' || category === '택시팟') base.unshift('위치인증');
    base.splice(1, 0, '방장인증');

    if (Array.isArray(input.trustBadges) && input.trustBadges.length) {
      return Array.from(new Set([...base, ...input.trustBadges]));
    }

    return base;
  }

  function buildDetail(category, input) {
    const detail = {};
    (CATEGORY_FIELDS[category] || []).forEach((field) => {
      if (input[field]) detail[field] = input[field];
    });
    return detail;
  }

  function buildTimeline(category) {
    if (category === '배달팟') {
      return [
        { label: '모집 시작', state: 'done' },
        { label: '주문 예정', state: 'current' },
        { label: '정산 완료', state: 'pending' }
      ];
    }
    if (category === '택시팟') {
      return [
        { label: '모집 시작', state: 'done' },
        { label: '출발 대기', state: 'current' },
        { label: '정산 완료', state: 'pending' }
      ];
    }
    if (category === '구독팟') {
      return [
        { label: '자리 모집', state: 'done' },
        { label: '정산 요청', state: 'current' },
        { label: '공유 시작', state: 'pending' }
      ];
    }

    return [
      { label: '모집 시작', state: 'done' },
      { label: '공동 진행', state: 'current' },
      { label: '정산 완료', state: 'pending' }
    ];
  }

  function createPot(input, idFactory) {
    const category = input.category || '기타팟';
    const defaults = CATEGORY_DEFAULTS[category] || CATEGORY_DEFAULTS['기타팟'];
    const host = input.host || { id: 'me', name: '민아', avatar: '민', isMe: true };

    const pot = {
      id: idFactory ? idFactory() : `pot-${Date.now()}`,
      category,
      subCategory: input.subCategory || defaults.subCategory,
      title: input.title || '새 팟',
      description: input.description || '근처 메이트를 빠르게 모아볼까요?',
      host,
      currentMembers: 1,
      maxMembers: Number(input.maxMembers || 4),
      participants: [
        { id: host.id, name: host.name, avatar: host.avatar || host.name[0], paid: true, isMe: Boolean(host.isMe) }
      ],
      waitingParticipants: [],
      perPersonAmount: Number(input.perPersonAmount || 0),
      distanceMeters: Number(input.distanceMeters || 120),
      joinRadiusMeters: Number(input.joinRadiusMeters || defaults.joinRadiusMeters),
      locationSummary: input.locationSummary || input.location || input.pickupPoint || input.departurePoint || input.place || '가천대 정문 근처',
      deadlineLabel: input.deadlineLabel || input.deadline || '오늘 22:00',
      recruitStatus: '모집중',
      settlementStage: '정산 대기',
      urgencyLabel: input.urgencyLabel || '모집 새로 시작',
      urgencyRank: Number(input.urgencyRank || 3),
      trustBadges: buildTrustBadges(category, input),
      detail: buildDetail(category, input),
      timeline: Array.isArray(input.timeline) && input.timeline.length ? clone(input.timeline) : buildTimeline(category)
    };

    pot.recruitStatus = normalizeRecruitStatus(pot);
    return pot;
  }

  function canJoinPot(pot, pointBalance, userDistance) {
    if (normalizeRecruitStatus(pot) === '모집완료') {
      return { ok: false, reason: '모집 인원이 모두 찼어요.' };
    }
    if (pot.recruitStatus && !['모집중', '마감임박'].includes(pot.recruitStatus) && normalizeRecruitStatus(pot) !== '마감임박') {
      return { ok: false, reason: '지금은 참여할 수 없는 모집 상태예요.' };
    }
    if (Number(userDistance || pot.distanceMeters || 0) > Number(pot.joinRadiusMeters || 0)) {
      return { ok: false, reason: '참여 가능 거리 밖에 있어요. 위치 인증 후 다시 시도해 주세요.' };
    }
    if (Number(pointBalance || 0) < Number(pot.perPersonAmount || 0)) {
      return { ok: false, reason: '포인트가 부족해요. 충전 후 참여해 주세요.' };
    }
    return { ok: true };
  }

  function ensureChat(chats, pot) {
    if (chats[pot.id]) return chats[pot.id];
    return {
      potId: pot.id,
      notice: `${pot.category} 진행 전 장소와 정산 금액을 다시 한 번 확인해 주세요.`,
      messages: [
        {
          from: 'system',
          type: 'system',
          text: `${pot.title} 채팅방이 열렸어요. 모집과 정산은 이 방에서 이어집니다.`
        }
      ]
    };
  }

  function sendChatMessage(state, potId, message) {
    const next = clone(state);
    const pot = next.pots.find((item) => item.id === potId);
    if (!pot) return next;
    next.chats = next.chats || {};
    next.chats[potId] = ensureChat(next.chats, pot);
    next.chats[potId].messages.push(message);
    return next;
  }

  function updatePotStage(pot, stage) {
    pot.settlementStage = stage;
    pot.timeline = buildSettlementStages(stage).map((item) => ({ label: item.label, state: item.state }));
  }

  function joinPot(state, potId) {
    const next = clone(state);
    const pot = next.pots.find((item) => item.id === potId);
    if (!pot) return next;

    pot.participants = pot.participants || [];
    if (!pot.participants.some((member) => member.id === next.user.id)) {
      pot.participants.push({
        id: next.user.id,
        name: next.user.name,
        avatar: next.user.avatar || next.user.name[0],
        paid: false,
        isMe: true
      });
      pot.currentMembers += 1;
    }

    pot.recruitStatus = normalizeRecruitStatus(pot);
    next.activeChatId = potId;
    next.chats = next.chats || {};
    next.chats[potId] = ensureChat(next.chats, pot);
    next.chats[potId].messages.push({
      from: 'system',
      type: 'system',
      text: `${next.user.name}님이 참여했어요. 모집과 정산 흐름이 채팅방에 연결됩니다.`
    });

    next.payments = next.payments || [];
    next.payments.unshift({
      id: `pay-${Date.now()}`,
      potId,
      title: pot.title,
      category: pot.category,
      amount: Number(pot.perPersonAmount || 0),
      status: '참여중',
      date: '방금'
    });

    return next;
  }

  function upsertPayment(next, payment) {
    const existingIndex = (next.payments || []).findIndex((item) => item.potId === payment.potId && item.category === payment.category);
    if (existingIndex >= 0) {
      next.payments[existingIndex] = { ...next.payments[existingIndex], ...payment };
      return;
    }
    next.payments.unshift(payment);
  }

  function requestSettlement(state, potId, totalAmount) {
    const next = clone(state);
    const pot = next.pots.find((item) => item.id === potId);
    if (!pot) return next;

    const participants = pot.participants && pot.participants.length ? pot.participants : [];
    const perPersonAmount = Math.ceil(Number(totalAmount || 0) / Math.max(participants.length, 1));

    pot.perPersonAmount = perPersonAmount;
    pot.participants = participants.map((member) => ({
      ...member,
      paid: member.id === pot.host.id
    }));
    updatePotStage(pot, '정산 요청됨');

    next.settlements = next.settlements || [];
    next.settlements.unshift({
      id: `settlement-${Date.now()}`,
      potId,
      title: pot.title,
      amount: perPersonAmount,
      totalAmount: Number(totalAmount || 0),
      status: '정산 요청됨',
      date: '방금'
    });

    next.payments = next.payments || [];
    if (pot.participants.some((member) => member.id === next.user.id && !member.paid)) {
      upsertPayment(next, {
        id: `payment-${Date.now()}`,
        potId,
        title: pot.title,
        category: pot.category,
        amount: perPersonAmount,
        status: '정산 요청됨',
        date: '방금'
      });
    }

    next.chats = next.chats || {};
    next.chats[potId] = ensureChat(next.chats, pot);
    next.chats[potId].messages.push({
      from: 'system',
      type: 'system',
      text: `정산 요청이 도착했어요. 1인당 ${formatWon(perPersonAmount)}씩 결제해 주세요.`
    });

    return next;
  }

  function sendReminder(name) {
    return `${name}님에게 리마인드 알림을 보냈어요. 아직 정산하지 않은 메이트가 있어요.`;
  }

  function markParticipantPaid(state, potId, participantId, amount) {
    const next = clone(state);
    const pot = next.pots.find((item) => item.id === potId);
    if (!pot) return next;

    let deducted = false;
    pot.participants = (pot.participants || []).map((member) => {
      if (member.id !== participantId) return member;
      deducted = !member.paid;
      return { ...member, paid: true };
    });

    const totalAmount = Number(amount || pot.perPersonAmount || 0);
    if (participantId === next.user.id && deducted) {
      next.pointBalance = Math.max(Number(next.pointBalance || 0) - totalAmount, 0);
    }

    const allPaid = pot.participants.length > 0 && pot.participants.every((member) => member.paid);
    updatePotStage(pot, allPaid ? '정산 완료' : '정산 요청됨');

    next.payments = next.payments || [];
    upsertPayment(next, {
      id: `paid-${Date.now()}`,
      potId,
      title: pot.title,
      category: pot.category,
      amount: totalAmount,
      status: allPaid || participantId === next.user.id ? '정산 완료' : '정산 요청됨',
      date: '방금'
    });

    next.settlements = (next.settlements || []).map((item) => (
      item.potId === potId
        ? { ...item, status: allPaid ? '정산 완료' : '정산 요청됨' }
        : item
    ));

    next.chats = next.chats || {};
    next.chats[potId] = ensureChat(next.chats, pot);
    next.chats[potId].messages.push({
      from: 'system',
      type: 'system',
      text: allPaid
        ? '모든 메이트의 정산이 완료됐어요. 팟을 안전하게 마무리합니다.'
        : '정산 완료가 반영됐어요. 남은 메이트의 결제를 기다리고 있어요.'
    });

    return next;
  }

  function chargePoints(state, amount) {
    const next = clone(state);
    next.pointBalance = Number(next.pointBalance || 0) + Number(amount || 0);
    next.payments = next.payments || [];
    next.payments.unshift({
      id: `charge-${Date.now()}`,
      title: '포인트 충전',
      category: '포인트',
      amount: Number(amount || 0),
      status: '충전 완료',
      date: '방금'
    });
    return next;
  }

  function getPaymentHistory(state) {
    return clone(state.payments || []);
  }

  function buildWalletSections(state) {
    const payments = clone(state.payments || []);
    return {
      pending: payments.filter((item) => item.status === '정산 요청됨' || item.status === '참여중'),
      completed: payments.filter((item) => item.status === '정산 완료' || item.status === '충전 완료'),
      recent: payments
    };
  }

  function buildSettlementStages(currentStage) {
    const currentIndex = Math.max(SETTLEMENT_STAGES.indexOf(currentStage), 0);
    return SETTLEMENT_STAGES.map((label, index) => ({
      label,
      state: index < currentIndex ? 'done' : index === currentIndex ? 'current' : 'pending'
    }));
  }

  function updateRecruitmentStatus(state, potId, recruitStatus) {
    const next = clone(state);
    const pot = next.pots.find((item) => item.id === potId);
    if (!pot) return next;
    pot.recruitStatus = recruitStatus;
    if (recruitStatus === '모집완료' && pot.currentMembers < pot.maxMembers) {
      pot.currentMembers = pot.maxMembers;
    }
    return next;
  }

  return {
    formatWon,
    filterPots,
    sortPots,
    buildHomeSections,
    buildCategoryStats,
    createPot,
    canJoinPot,
    joinPot,
    requestSettlement,
    sendReminder,
    chargePoints,
    markParticipantPaid,
    getPaymentHistory,
    buildWalletSections,
    buildSettlementStages,
    sendChatMessage,
    updateRecruitmentStatus
  };
});


/* js/app.js */
const core = window.PotMateCore;
const categories = ['전체', '배달팟', '택시팟', '구독팟', '기타팟'];
const createCategories = categories.slice(1);

let state = {
  ...JSON.parse(JSON.stringify(window.PotMateSeed)),
  route: 'onboarding',
  selectedCategory: '전체',
  query: '',
  selectedPotId: 'pot-taxi-1',
  radiusFilter: 500,
  sortMode: 'distance',
  settlementTotal: 26000,
  createCategory: '배달팟'
};

let isSearchComposing = false;

const app = document.querySelector('#app');
const toast = document.querySelector('#toast');

function won(amount) {
  return core.formatWon(amount);
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function potById(id) {
  return state.pots.find((pot) => pot.id === id);
}

function isJoined(pot) {
  return Boolean((pot.participants || []).some((member) => member.id === state.user.id));
}

function currentMember(pot) {
  return (pot.participants || []).find((member) => member.id === state.user.id);
}

function heroSpotlightText(pot) {
  if (!pot) {
    return {
      title: '내 주변 추천',
      description: '지금 근처에서 바로 참여할 수 있는 팟을 보여드려요.'
    };
  }

  const seatsLeft = Math.max(pot.maxMembers - pot.currentMembers, 0);
  return {
    title: '내 주변 추천',
    description: `${pot.distanceMeters}m · ${pot.subCategory} · ${seatsLeft}명 남음`
  };
}

function getHomeSections() {
  return core.buildHomeSections(state.pots, {
    category: state.selectedCategory,
    query: state.query,
    radius: state.radiusFilter,
    sortMode: state.sortMode
  });
}

function renderHomeCategoryStats(sections) {
  return sections.categoryStats.map((item) => `
    <div class="hub-stat">
      <span>${item.category}</span>
      <strong>${item.count}개</strong>
      <span class="hub-stat__meta">${item.closestDistance === null ? '모집 없음' : `${item.closestDistance}m부터`}</span>
    </div>
  `).join('');
}

function renderHomeSpotlight(sections) {
  const spotlightPot = sections.recommended[0] || sections.visible[0] || state.pots[0];
  const spotlight = heroSpotlightText(spotlightPot);

  return `
    <strong>${spotlight.title}</strong>
    <span>${spotlight.description}</span>
  `;
}

function renderHomeResults(sections) {
  const promo = state.promoBanners[0];

  return `
    <section class="home-section">
      <div class="section-heading">
        <h2>지금 참여하기 좋은 팟</h2>
        <span>${sections.visible.length}개</span>
      </div>
      <div class="pot-list pot-list--home">
        ${sections.recommended.length
          ? sections.recommended.map((pot) => potCard(pot)).join('')
          : '<div class="empty-state">조건에 맞는 팟이 아직 없어요.</div>'}
      </div>
    </section>

    <section class="home-section closing-soon-section">
      <div class="section-heading">
        <h2>마감 임박</h2>
        <span>놓치기 전에 확인</span>
      </div>
      <div class="spotlight-grid">
        ${sections.closingSoon.length
          ? sections.closingSoon.map((pot) => potCard(pot, { compact: true })).join('')
          : '<div class="empty-state">급한 모집은 아직 없어요.</div>'}
      </div>
    </section>

    <section class="home-section category-spotlight">
      <div class="section-heading">
        <h2>카테고리별 대표 팟</h2>
        <span>균형 있게 둘러보기</span>
      </div>
      <div class="spotlight-grid">
        ${sections.categorySpotlights.map((pot) => potCard(pot, { compact: true })).join('')}
      </div>
    </section>

    <section class="home-section">
      <div class="coupon-card">
        <span>${promo.label}</span>
        <strong>${promo.title}</strong>
        <p>${promo.description}</p>
      </div>
    </section>
  `;
}

function updateHomeSearchResults(input) {
  if (state.route !== 'home') {
    return;
  }

  const value = input ? input.value : state.query;
  const selectionStart = input ? input.selectionStart : null;
  const selectionEnd = input ? input.selectionEnd : null;

  state.query = value;
  const sections = getHomeSections();

  const stats = document.querySelector('#home-category-stats');
  if (stats) {
    stats.innerHTML = renderHomeCategoryStats(sections);
  }

  const spotlight = document.querySelector('#home-spotlight-card');
  if (spotlight) {
    spotlight.innerHTML = renderHomeSpotlight(sections);
  }

  const results = document.querySelector('#home-results');
  if (results) {
    results.innerHTML = renderHomeResults(sections);
  }

  if (!input) {
    return;
  }

  const nextInput = document.querySelector('#search-input');
  if (!nextInput) {
    return;
  }

  nextInput.focus();
  const cursorStart = typeof selectionStart === 'number' ? selectionStart : value.length;
  const cursorEnd = typeof selectionEnd === 'number' ? selectionEnd : cursorStart;
  nextInput.setSelectionRange(cursorStart, cursorEnd);
}

function setRoute(route, selectedPotId) {
  state.route = route;
  if (selectedPotId) {
    state.selectedPotId = selectedPotId;
  }
  render();
}

function showToast(message) {
  toast.textContent = message;
  toast.classList.add('is-visible');
  window.clearTimeout(showToast.timer);
  showToast.timer = window.setTimeout(() => toast.classList.remove('is-visible'), 2200);
}

}

function backButton(target = 'home') {

}

function trustBadges(pot) {

function participantStrip(pot) {

function stageTrack(stage) {

          <div class="stage-step is-${item.state}">

function detailRows(pot) {

function timelineCard(pot) {

  return `
    <article class="glass-card timeline-card">
      <div class="section-heading">
        <h2>진행 타임라인</h2>

      </div>

function potCard(pot, options = {}) {

      <div class="pot-card__head">

      </div>
      <h2>${pot.title}</h2>
      <p class="card-copy">${pot.description}</p>
      ${trustBadges(pot)}
      <div class="meta-grid">
        <div class="meta-chip">거리<strong>${pot.distanceMeters}m</strong></div>
        <div class="meta-chip">남은 자리<strong>${seatsLeft}명</strong></div>
        <div class="meta-chip">예상 금액<strong>${won(pot.perPersonAmount)}</strong></div>
        <div class="meta-chip">마감/상태<strong>${pot.deadlineLabel}</strong></div>
      </div>
      <div class="pot-card__footer">
        <span class="inline-note">${pot.subCategory}</span>
        <button class="gradient-button ${compact ? '' : 'full-button'}" type="button" data-join-id="${pot.id}">
          ${joined ? '채팅으로 이동' : '참여하기'}
        </button>
      </div>
    </article>
  `;
}

function historyCard(payment) {
  return `

function memberForMessage(pot, message) {
  if (message.from === state.user.id || message.mine) {
    return { id: state.user.id, name: state.user.name, avatar: state.user.avatar, isMe: true };
  }

  return (pot.participants || []).find((member) => member.id === message.from)
    || (message.from === pot.host.id ? pot.host : null)
    || { id: message.from, name: message.name || '메이트', avatar: (message.name || '메')[0] };
}

function renderMessage(pot, message) {
  if (message.system || message.type === 'system') {
    return `<div class="message system">${message.text}</div>`;
  }

  const isOwn = message.mine || message.from === state.user.id;
  const member = memberForMessage(pot, message);
  const isHostMessage = message.from === pot.host.id || message.type === 'host';

  return `
    <div class="message-row ${isOwn ? 'is-own' : ''}">
      ${isOwn ? '' : `<div class="message-profile">${member.avatar || member.name[0]}</div>`}
      <div class="message-body">
        ${isOwn ? '' : `
          <div class="message-name">
            <span>${member.name}</span>
            ${isHostMessage ? '<span class="host-badge">방장</span>' : ''}
          </div>
        `}
        <div class="message ${isOwn ? 'mine' : ''}">${message.text}</div>
      </div>
    </div>
  `;
}

          <span>카테고리</span>
          <select name="category" id="create-category">
            ${createCategories.map((item) => `<option ${item === category ? 'selected' : ''}>${item}</option>`).join('')}
          </select>
        </label>
        <label class="form-field"><span>팟 제목</span><input name="title" required placeholder="예: 마라탕 같이 시켜요"></label>
        <label class="form-field"><span>모집 인원</span><input name="maxMembers" type="number" min="2" value="4"></label>
        <label class="form-field"><span>예상 1인 금액</span><input name="perPersonAmount" type="number" value="8000"></label>
        <label class="form-field"><span>위치 요약</span><input name="locationSummary" required placeholder="예: 가천대 정문 앞"></label>
        <label class="form-field"><span>마감 상태 문구</span><input name="deadlineLabel" placeholder="예: 오늘 22:00 마감"></label>
        ${categoryFields(category)}
        <label class="form-field"><span>설명</span><textarea name="description" placeholder="메이트에게 보여줄 간단한 설명"></textarea></label>
        <button class="gradient-button full-button" type="submit">새 팟 생성하기</button>
      </form>
    </section>
    ${nav('create')}
  `;
}

function render() {
  switch (state.route) {
    case 'home':
      renderHome();
      break;
    case 'detail':
      renderDetail();
      break;
    case 'confirm':
      renderConfirm();
      break;
    case 'chat':
      renderChat();
      break;
    case 'settlement':
      renderSettlement();
      break;
    case 'my':
      renderMy();
      break;
    case 'create':
      renderCreate();
      break;
    case 'login':
      renderLogin();
      break;
    default:
      renderOnboarding();
      break;
  }
}

app.addEventListener('click', (event) => {
  const routeButton = event.target.closest('[data-route]');
  const joinButton = event.target.closest('[data-join-id]');
  const confirmJoin = event.target.closest('[data-confirm-join]');
  const chargeButton = event.target.closest('[data-charge]');
  const requestSettlementButton = event.target.closest('[data-request-settlement]');
  const remindButton = event.target.closest('[data-remind]');
  const sendMessageButton = event.target.closest('[data-send-message]');
  const closePotButton = event.target.closest('[data-close-pot]');
  const manageButton = event.target.closest('[data-manage]');
  const payButton = event.target.closest('[data-pay-settlement]');
  const openCard = event.target.closest('[data-pot-id]');
  const selectPotButton = event.target.closest('[data-select-pot]');
  const onboardingCategoryButton = event.target.closest('[data-onboarding-category]');

  if (onboardingCategoryButton) {
    state.selectedCategory = onboardingCategoryButton.dataset.onboardingCategory;
    setRoute('home');
    return;
  }

  if (joinButton) {
    event.stopPropagation();
    const pot = potById(joinButton.dataset.joinId);
    if (pot && isJoined(pot)) {
      state.activeChatId = pot.id;
      setRoute('chat', pot.id);
      return;
    }
    setRoute('confirm', joinButton.dataset.joinId);
    return;
  }

  if (openCard) {
    setRoute('detail', openCard.dataset.potId);
    return;
  }

  if (selectPotButton) {
    state.selectedPotId = selectPotButton.dataset.selectPot;
  }

  if (routeButton) {
    const route = routeButton.dataset.route;
    if (route === 'chat') {
      setRoute('chat', state.activeChatId || state.selectedPotId || state.pots[0].id);
      return;
    }
    if (route === 'settlement') {
      const targetPot = state.selectedPotId || state.activeChatId || state.pots[0].id;
      const pot = potById(targetPot);
      if (pot) {
        state.settlementTotal = pot.perPersonAmount * Math.max((pot.participants || []).length, 1);
      }
      setRoute('settlement', targetPot);
      return;
    }
    setRoute(route, state.selectedPotId);
    return;
  }

  if (confirmJoin) {
    state = core.joinPot(state, confirmJoin.dataset.confirmJoin);
    state.activeChatId = confirmJoin.dataset.confirmJoin;
    showToast('참여가 확정됐어요. 채팅방에서 일정과 정산을 이어가세요.');
    setRoute('chat', confirmJoin.dataset.confirmJoin);
    return;
  }

  if (chargeButton) {
    state = core.chargePoints(state, Number(chargeButton.dataset.charge));
    showToast(`${Number(chargeButton.dataset.charge).toLocaleString('ko-KR')}P가 충전됐어요.`);
    render();
    return;
  }

  if (requestSettlementButton) {
    state = core.requestSettlement(state, requestSettlementButton.dataset.requestSettlement, state.settlementTotal);
    showToast('정산 요청을 보냈어요. 채팅방과 My 결제에서 상태가 함께 갱신됩니다.');
    setRoute('chat', requestSettlementButton.dataset.requestSettlement);
    return;
  }

  if (remindButton) {
    showToast(core.sendReminder(remindButton.dataset.remind));
    return;
  }

  if (sendMessageButton) {
    const input = document.querySelector('#message-input');
    const text = input.value.trim();
    if (!text) return;
    state = core.sendChatMessage(state, sendMessageButton.dataset.sendMessage, {
      from: state.user.id,
      name: state.user.name,
      text,
      mine: true,
      type: 'mine'
    });
    render();
    return;
  }

  if (closePotButton) {
    state = core.updateRecruitmentStatus(state, closePotButton.dataset.closePot, '모집완료');
    showToast('모집을 마감했어요. 이제 정산 단계로 이어갈 수 있어요.');
    render();
    return;
  }

  if (manageButton) {
    const pot = potById(manageButton.dataset.manage);
    const waiting = (pot && pot.waitingParticipants) ? pot.waitingParticipants.length : 0;
    showToast(waiting ? `대기 중인 메이트가 ${waiting}명 있어요.` : '현재 대기 인원은 없어요.');
    return;
  }

  if (payButton) {
    const pot = potById(payButton.dataset.paySettlement);
    state = core.markParticipantPaid(state, payButton.dataset.paySettlement, state.user.id, pot.perPersonAmount);
    showToast(`내 몫 ${won(pot.perPersonAmount)} 결제가 반영됐어요.`);
    render();
  }
});

app.addEventListener('input', (event) => {
  if (event.target.id === 'search-input') {
    state.query = event.target.value;
    if (isSearchComposing) {
      return;
    }
    updateHomeSearchResults(event.target);
    return;
  }

  if (event.target.id === 'settlement-total') {
    state.settlementTotal = Number(event.target.value || 0);
    renderSettlement();
  }
});

app.addEventListener('compositionstart', (event) => {
  if (event.target.id === 'search-input') {
    isSearchComposing = true;
  }
});

app.addEventListener('compositionend', (event) => {
  if (event.target.id === 'search-input') {
    isSearchComposing = false;
    updateHomeSearchResults(event.target);
  }
});

app.addEventListener('change', (event) => {
  if (event.target.id === 'create-category') {
    state.createCategory = event.target.value;
    renderCreate();
    return;
  }

  if (event.target.id === 'radius-filter') {
    state.radiusFilter = Number(event.target.value || 500);
    renderHome({ animate: false });
    return;
  }

  if (event.target.id === 'sort-filter') {
    state.sortMode = event.target.value;
    renderHome({ animate: false });
  }
});

app.addEventListener('click', (event) => {
  const categoryButton = event.target.closest('[data-category]');
  if (!categoryButton) return;
  state.selectedCategory = categoryButton.dataset.category;
  renderHome({ animate: false });
});

app.addEventListener('submit', (event) => {
  if (event.target.id === 'login-form') {
    event.preventDefault();
    const formData = new FormData(event.target);
    const loginId = String(formData.get('loginId') || '').trim();
    showToast(`${loginId || 'PotMate'} 계정으로 로그인했어요.`);
    setRoute('home');
    return;
  }

  if (event.target.id !== 'create-form') return;
  event.preventDefault();

  const formData = new FormData(event.target);
  const input = Object.fromEntries(formData.entries());
  const pot = core.createPot({
    ...input,
    host: { id: state.user.id, name: state.user.name, avatar: state.user.avatar, isMe: true },
    distanceMeters: 140,
    urgencyLabel: '새 모집',
    urgencyRank: 2,
    trustBadges: ['위치인증', '방장인증', '안전정산']
  });

  state.pots.unshift(pot);
  state.selectedPotId = pot.id;
  state.activeChatId = pot.id;
  state.chats[pot.id] = {
    potId: pot.id,
    notice: `${pot.category} 생성이 완료됐어요. 모집이 완료되면 이 방에서 정산을 이어갈 수 있어요.`,
    messages: [
      { from: 'system', text: '새 팟이 생성됐어요. 메이트 모집을 시작합니다.', type: 'system', system: true }
    ]
  };

  showToast('새 팟을 만들었어요. 상세에서 모집 정보를 바로 확인해 보세요.');
  setRoute('detail', pot.id);
});

render();

  </script>
</body>
</html>
